<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;width:300px;background:#fff;color:#1a1a1a}
.header{background:#e67e22;padding:12px 14px;display:flex;align-items:center;gap:10px}
.header-text h1{color:#fff;font-size:14px;font-weight:700;margin:0}
.header-text p{color:rgba(255,255,255,.8);font-size:11px;margin:0}
.body{padding:14px}
.status{font-size:13px;color:#888;text-align:center;padding:16px 0}
.info{background:#fef9f0;border:1px solid #f5deb3;border-radius:8px;padding:12px;margin-bottom:10px}
.num{font-size:22px;font-weight:700;color:#e67e22}
.det{font-size:12px;color:#666;margin-top:3px}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px}
.btn-ok{background:#27ae60;color:#fff}
.btn-ok:disabled{background:#aaa}
.btn-sec{background:#f0f0f0;color:#333}
.erro{background:#fdecea;border:1px solid #f5c6cb;border-radius:6px;padding:10px;font-size:12px;color:#c0392b;margin-bottom:8px}
</style>
</head>
<body>
<div class="header">
  <span style="font-size:22px">🚚</span>
  <div class="header-text">
    <h1>Mais Acessível</h1>
    <p>Cotação de Frete</p>
  </div>
</div>
<div class="body" id="body">
  <p class="status">Carregando...</p>
</div>
<script src="popup.js"></script>
</body>
</html>
